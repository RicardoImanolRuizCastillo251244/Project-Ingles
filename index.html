<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sopa de Letras de Adjetivos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Adjectives Word Search</h1>
    <p>Encuentra los adjetivos ocultos en la sopa de letras.</p>

    <!-- Contenedor principal del juego -->
    <div class="game-container">
        <!-- Cuadrícula de la sopa de letras -->
        <div id="wordSearchGrid" class="grid"></div>

        <!-- Lista de palabras a buscar -->
        <div class="word-list">
            <h3>Words to find:</h3>
            <ul>
                <li id="word-HAPPY">How do you feel when you win a prize?</li>
                <li id="word-SAD">How do you feel when you lose your favorite thing?</li>
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
